<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="wanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="ufwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="allowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="denyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="hostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="950" height="580" fill="url(#bgGrad)" rx="16"/>

  <rect x="25" y="20" width="900" height="60" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="475" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#f8fafc" text-anchor="middle">KIẾN TRÚC TƯỜNG LỬA UFW VÀ BẢO VỆ CỔNG MẠNG CLOUD VPS</text>
  <text x="475" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Uncomplicated Firewall (UFW) • Netfilter Rules • Diagnostic Tools (ss, curl, ufw)</text>

  <g transform="translate(40, 105)">
    <rect width="180" height="340" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="180" height="42" rx="12" fill="url(#wanGrad)"/>
    <text x="90" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">INTERNET / WAN</text>

    <g transform="translate(15, 60)">
      <rect width="150" height="55" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="75" y="25" font-family="sans-serif" font-size="12" font-weight="600" fill="#60a5fa" text-anchor="middle">DevOps Admin</text>
      <text x="75" y="44" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">SSH Port 22/tcp</text>
    </g>

    <g transform="translate(15, 130)">
      <rect width="150" height="55" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="75" y="25" font-family="sans-serif" font-size="12" font-weight="600" fill="#34d399" text-anchor="middle">Web Users / API</text>
      <text x="75" y="44" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">HTTP Port 8080/tcp</text>
    </g>

    <g transform="translate(15, 200)">
      <rect width="150" height="55" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="75" y="25" font-family="sans-serif" font-size="12" font-weight="600" fill="#f87171" text-anchor="middle">Unauthorized</text>
      <text x="75" y="44" font-family="monospace" font-size="11" fill="#fca5a5" text-anchor="middle">Ports 3306, 23, 80...</text>
    </g>

    <g transform="translate(15, 275)">
      <rect width="150" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="75" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Outbound Requests</text>
      <text x="75" y="38" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">apt update, git push...</text>
    </g>
  </g>

  <g transform="translate(265, 105)">
    <rect width="380" height="340" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8" filter="url(#shadow)"/>
    <rect width="380" height="42" rx="12" fill="url(#ufwGrad)"/>
    <text x="190" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">UFW FIREWALL / NETFILTER LAYER</text>

    <g transform="translate(15, 52)">
      <rect width="350" height="34" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="175" y="22" font-family="monospace" font-size="11" fill="#fbbf24" text-anchor="middle">Default: deny (incoming), allow (outgoing)</text>
    </g>

    <g transform="translate(15, 96)">
      <rect width="350" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="25" cy="30" r="10" fill="url(#allowGrad)"/>
      <path d="M21 30 L24 33 L29 27" stroke="#ffffff" stroke-width="2" fill="none"/>
      <text x="45" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#ecfdf5">Quy tắc 1: 22/tcp ALLOW IN (SSH)</text>
      <text x="45" y="46" font-family="monospace" font-size="11" fill="#6ee7b7">ufw allow 22/tcp • Anywhere (IPv4 &amp; IPv6)</text>
    </g>

    <g transform="translate(15, 166)">
      <rect width="350" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="25" cy="30" r="10" fill="url(#allowGrad)"/>
      <path d="M21 30 L24 33 L29 27" stroke="#ffffff" stroke-width="2" fill="none"/>
      <text x="45" y="26" font-family="sans-serif" font-size="12" font-weight="700" fill="#ecfdf5">Quy tắc 2: 8080/tcp ALLOW IN (Web App)</text>
      <text x="45" y="46" font-family="monospace" font-size="11" fill="#6ee7b7">ufw allow 8080/tcp • Anywhere (IPv4 &amp; IPv6)</text>
    </g>

    <g transform="translate(15, 236)">
      <rect width="350" height="50" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.2"/>
      <circle cx="25" cy="25" r="10" fill="url(#denyGrad)"/>
      <path d="M21 21 L29 29 M29 21 L21 29" stroke="#ffffff" stroke-width="2" fill="none"/>
      <text x="45" y="22" font-family="sans-serif" font-size="12" font-weight="700" fill="#fef2f2">Mặc định: Chặn toàn bộ cổng còn lại</text>
      <text x="45" y="39" font-family="monospace" font-size="11" fill="#fca5a5">Port 3306, 23, 80... -> DROP / REJECT</text>
    </g>

    <g transform="translate(15, 296)">
      <rect width="350" height="34" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
      <text x="175" y="22" font-family="sans-serif" font-size="11" font-weight="600" fill="#93c5fd" text-anchor="middle">Kết nối đi ra (Outgoing): Mở toàn bộ (ALLOW)</text>
    </g>
  </g>

  <g transform="translate(690, 105)">
    <rect width="220" height="340" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect width="220" height="42" rx="12" fill="url(#hostGrad)"/>
    <text x="110" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">LINUX SERVICES</text>

    <g transform="translate(15, 60)">
      <rect width="190" height="65" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="95" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">OpenSSH Server</text>
      <text x="95" y="42" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">0.0.0.0:22 (LISTEN)</text>
      <text x="95" y="56" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">sshd (PID: 842)</text>
    </g>

    <g transform="translate(15, 140)">
      <rect width="190" height="65" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="95" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">Web Application</text>
      <text x="95" y="42" font-family="monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">0.0.0.0:8080 (LISTEN)</text>
      <text x="95" y="56" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">node / python / app</text>
    </g>

    <g transform="translate(15, 220)">
      <rect width="190" height="100" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
      <text x="95" y="22" font-family="sans-serif" font-size="11" font-weight="700" fill="#cbd5e1" text-anchor="middle">Chẩn đoán mạng (CLI)</text>
      <text x="95" y="44" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">ss -tlnp</text>
      <text x="95" y="64" font-family="monospace" font-size="11" fill="#fbbf24" text-anchor="middle">ufw status verbose</text>
      <text x="95" y="84" font-family="monospace" font-size="11" fill="#a78bfa" text-anchor="middle">curl -I localhost:8080</text>
    </g>
  </g>

  <path d="M 220 190 L 265 230" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,4" fill="none"/>
  <path d="M 220 265 L 265 300" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,4" fill="none"/>
  <path d="M 220 335 L 265 365" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,4" fill="none"/>

  <path d="M 645 230 L 690 190" stroke="#10b981" stroke-width="2.5" fill="none"/>
  <path d="M 645 300 L 690 270" stroke="#10b981" stroke-width="2.5" fill="none"/>

  <rect x="40" y="470" width="870" height="85" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text x="60" y="495" font-family="sans-serif" font-size="12" font-weight="700" fill="#38bdf8">TỔNG KẾT BẢO MẬT HỆ THỐNG VỚI UFW:</text>
  <text x="60" y="517" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">• Chỉ mở 2 cổng tối cần thiết: Cổng 22 (quản trị SSH an toàn) và Cổng 8080 (phục vụ ứng dụng web).</text>
  <text x="60" y="537" font-family="sans-serif" font-size="11.5" fill="#cbd5e1">• Mọi nỗ lực quét cổng (port scan) hoặc tấn công vào các cổng nội bộ chưa được cấp phép (3306, 6379, 23...) đều bị chặn hoàn toàn ở tầng Netfilter.</text>
</svg>
