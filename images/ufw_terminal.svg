<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 680" width="100%" height="100%">
  <defs>
    <linearGradient id="termHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="100%" stop-color="#1a202c" />
    </linearGradient>
    <filter id="winShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="950" height="680" rx="14" fill="#0f172a"/>

  <g filter="url(#winShadow)">
    <rect x="25" y="25" width="900" height="630" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
    <rect x="25" y="25" width="900" height="38" rx="10" fill="url(#termHeader)"/>
    
    <circle cx="48" cy="44" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
    <circle cx="68" cy="44" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
    <circle cx="88" cy="44" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

    <text x="475" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="12" font-weight="600" fill="#c9d1d9" text-anchor="middle">admin@cloud-vps: ~ • UFW &amp; Network Port Diagnostics</text>

    <g font-family="'Fira Code', 'JetBrains Mono', Consolas, monospace" font-size="12">
      <!-- Prompt 1: default deny incoming -->
      <text x="45" y="90" fill="#58a6ff" font-weight="600">admin@cloud-vps:~$</text>
      <text x="200" y="90" fill="#f0f6fc">sudo ufw default deny incoming</text>
      <text x="45" y="110" fill="#8b949e">Default incoming policy changed to 'deny'</text>
      <text x="45" y="126" fill="#8b949e">(be sure to update your rules accordingly)</text>

      <!-- Prompt 2: default allow outgoing -->
      <text x="45" y="152" fill="#58a6ff" font-weight="600">admin@cloud-vps:~$</text>
      <text x="200" y="152" fill="#f0f6fc">sudo ufw default allow outgoing</text>
      <text x="45" y="172" fill="#8b949e">Default outgoing policy changed to 'allow'</text>

      <!-- Prompt 3: allow 22 & 8080 -->
      <text x="45" y="198" fill="#58a6ff" font-weight="600">admin@cloud-vps:~$</text>
      <text x="200" y="198" fill="#f0f6fc">sudo ufw allow 22/tcp &amp;&amp; sudo ufw allow 8080/tcp</text>
      <text x="45" y="218" fill="#3fb950">Rules updated</text>
      <text x="45" y="234" fill="#3fb950">Rules updated (v6)</text>

      <!-- Prompt 4: enable -->
      <text x="45" y="260" fill="#58a6ff" font-weight="600">admin@cloud-vps:~$</text>
      <text x="200" y="260" fill="#f0f6fc">sudo ufw --force enable</text>
      <text x="45" y="280" fill="#e3b341">Firewall is active and enabled on system startup</text>

      <!-- Prompt 5: status verbose -->
      <text x="45" y="306" fill="#58a6ff" font-weight="600">admin@cloud-vps:~$</text>
      <text x="200" y="306" fill="#f0f6fc">sudo ufw status verbose</text>
      <text x="45" y="326" fill="#f0f6fc">Status: <tspan fill="#3fb950" font-weight="700">active</tspan></text>
      <text x="45" y="342" fill="#8b949e">Logging: on (low)</text>
      <text x="45" y="358" fill="#8b949e">Default: <tspan fill="#f85149">deny (incoming)</tspan>, <tspan fill="#3fb950">allow (outgoing)</tspan>, disabled (routed)</text>
      <text x="45" y="374" fill="#8b949e">New profiles: skip</text>

      <text x="45" y="400" fill="#8b949e" font-weight="600">To                         Action      From</text>
      <text x="45" y="416" fill="#30363d">----------------------------------------------------</text>
      <text x="45" y="432" fill="#79c0ff">22/tcp</text>
      <text x="260" y="432" fill="#3fb950" font-weight="700">ALLOW IN</text>
      <text x="360" y="432" fill="#f0f6fc">Anywhere</text>

      <text x="45" y="450" fill="#79c0ff">8080/tcp</text>
      <text x="260" y="450" fill="#3fb950" font-weight="700">ALLOW IN</text>
      <text x="360" y="450" fill="#f0f6fc">Anywhere</text>

      <text x="45" y="468" fill="#79c0ff">22/tcp (v6)</text>
      <text x="260" y="468" fill="#3fb950" font-weight="700">ALLOW IN</text>
      <text x="360" y="468" fill="#f0f6fc">Anywhere (v6)</text>

      <text x="45" y="486" fill="#79c0ff">8080/tcp (v6)</text>
      <text x="260" y="486" fill="#3fb950" font-weight="700">ALLOW IN</text>
      <text x="360" y="486" fill="#f0f6fc">Anywhere (v6)</text>

      <!-- Prompt 6: ss -tlnp -->
      <text x="45" y="520" fill="#58a6ff" font-weight="600">admin@cloud-vps:~$</text>
      <text x="200" y="520" fill="#f0f6fc">ss -tlnp</text>
      <text x="45" y="540" fill="#8b949e">State    Recv-Q   Send-Q    Local Address:Port   Peer Address:Port   Process</text>
      <text x="45" y="556" fill="#3fb950">LISTEN   0        128             0.0.0.0:22          0.0.0.0:*       users:(("sshd",pid=842,fd=3))</text>
      <text x="45" y="572" fill="#3fb950">LISTEN   0        511             0.0.0.0:8080        0.0.0.0:*       users:(("node",pid=1420,fd=18))</text>
      <text x="45" y="588" fill="#3fb950">LISTEN   0        128                [::]:22             [::]:*       users:(("sshd",pid=842,fd=4))</text>
      <text x="45" y="604" fill="#3fb950">LISTEN   0        511                [::]:8080           [::]:*       users:(("node",pid=1420,fd=19))</text>

      <!-- Prompt 7: curl test -->
      <text x="45" y="632" fill="#58a6ff" font-weight="600">admin@cloud-vps:~$</text>
      <text x="200" y="632" fill="#f0f6fc">curl -I http://localhost:8080 | head -n 2</text>
      <text x="45" y="648" fill="#a5d6ff">HTTP/1.1 200 OK  Content-Type: text/html; charset=utf-8</text>
    </g>
  </g>
</svg>
